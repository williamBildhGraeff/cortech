version: "3.9"
services: 
 mysql: 
  image: "mysql:8.0"
  container_name: "mysql_local"
  restart: "unless-stopped"
  ports: 
   - "3306:3306"
  environment: 
    MYSQL_DATABASE: 'cortech'
    MYSQL_ROOT_PASSWORD: root
  volumes:
    - mysql_data:/var/lib/mysql
  
  command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: